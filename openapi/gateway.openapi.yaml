openapi: 3.1.0
info:
  title: Inference Gateway API
  version: 0.1.0
  description: Gateway contract through Milestone 4B, including governed chat completions and exact-cache status headers.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Gateway is healthy.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      operationId: createChatCompletion
      description: Authenticates the request, validates and governs a normalized payload, checks the configured exact-cache backend after governance admission, and delegates cache misses to a config-selected provider execution layer with timeout, retry, and optional secondary fallback behavior. Cache failures fail open; governance failures fail closed. When the selected real provider is a stub, the route returns a documented `501` response instead of calling an external API.
      security:
        - GatewayApiKey: []
      parameters:
        - name: x-request-id
          in: header
          required: false
          description: Optional request lifecycle identifier. Chat governance idempotency is scoped to the API key, this value, and the same normalized payload for 24 hours. Reusing the same value with a different normalized payload is governed as a distinct request.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion created.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
            x-cache-status:
              $ref: "#/components/headers/CacheStatusHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          description: Malformed JSON, invalid request shape, or abuse guard rejection.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body exceeded the configured size limit.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or ambiguous API key header.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit, daily token quota, or monthly budget exceeded.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
            retry-after:
              $ref: "#/components/headers/RetryAfterHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: The configured real-provider stub adapter intentionally does not call an external API.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Governance storage is unavailable, or provider execution failed after retries and optional fallback handling.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Provider execution exceeded the configured timeout budget.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    RequestIdHeader:
      description: Correlation ID for the request lifecycle. If supplied on the request, the same value is echoed.
      schema:
        type: string
    RetryAfterHeader:
      description: Seconds until the current fixed rate-limit window resets.
      schema:
        type: integer
        minimum: 1
    CacheStatusHeader:
      description: Exact-cache outcome for a successful chat completion response.
      schema:
        type: string
        enum: [miss, hit-exact, bypass]
  securitySchemes:
    GatewayApiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - uptimeSeconds
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        uptimeSeconds:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      additionalProperties: true
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required:
        - role
        - content
      additionalProperties: true
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - provider
        - requestId
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        provider:
          type: string
        requestId:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
        - finishReason
      properties:
        index:
          type: integer
          minimum: 0
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finishReason:
          type: string
          enum: [stop]
    AssistantMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [assistant]
        content:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
