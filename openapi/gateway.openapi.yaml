openapi: 3.1.0
info:
  title: Inference Gateway API
  version: 0.1.0
  description: Milestone 1 gateway contract.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Gateway is healthy.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/chat/completions:
    post:
      summary: Create a chat completion
      operationId: createChatCompletion
      description: Authenticates the request, validates a normalized payload, and delegates to the configured provider adapter. When `PROVIDER_KIND=real_stub`, the route returns a documented `501` stub response instead of calling an external API.
      security:
        - GatewayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion created.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          description: Malformed JSON or invalid request shape.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or ambiguous API key header.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: The configured real provider adapter is a Milestone 1 stub and intentionally does not call an external API.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    RequestIdHeader:
      description: Correlation ID for the request lifecycle.
      schema:
        type: string
  securitySchemes:
    GatewayApiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - uptimeSeconds
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        uptimeSeconds:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      additionalProperties: true
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required:
        - role
        - content
      additionalProperties: true
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - provider
        - requestId
        - choices
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        provider:
          type: string
        requestId:
          type: string
        choices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
    ChatCompletionChoice:
      type: object
      required:
        - index
        - message
        - finishReason
      properties:
        index:
          type: integer
          minimum: 0
        message:
          $ref: "#/components/schemas/AssistantMessage"
        finishReason:
          type: string
          enum: [stop]
    AssistantMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [assistant]
        content:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
