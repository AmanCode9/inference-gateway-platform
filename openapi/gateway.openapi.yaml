openapi: 3.1.0
info:
  title: Inference Gateway API
  version: 0.1.0
  description: Milestone 1 gateway contract.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Gateway is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/chat/completions:
    post:
      summary: Placeholder chat completions endpoint
      operationId: createChatCompletion
      description: Validates basic request shape and returns not implemented in Milestone 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "501":
          description: Chat completions routing is not implemented in Milestone 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
        - uptimeSeconds
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        uptimeSeconds:
          type: number
          minimum: 0
        timestamp:
          type: string
          format: date-time
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      additionalProperties: true
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required:
        - role
        - content
      additionalProperties: true
      properties:
        role:
          type: string
          minLength: 1
        content:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
